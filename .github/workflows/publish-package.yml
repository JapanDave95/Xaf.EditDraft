# Publishes Xaf.EditDraft.Core and Xaf.EditDraft.Blazor to GitHub Packages (this repository's NuGet feed,
# https://nuget.pkg.github.com/JapanDave95/index.json) when a version tag is pushed.
#
#   The tag must equal "v" + <Version> in Directory.Build.props (e.g. v0.1.0-preview.1); the job fails otherwise,
#   so a package version can never be published from a mismatched source.
#
# DevExpress 25.1+ packages come from nuget.org; what licenses the build is the DevExpress licence key, read by the
# DevExpress build analyzers from the environment variable DevExpress_License (case-sensitive) — see
# docs.devexpress.com/GeneralInformation/400604 ("Use DevExpress .NET Products in Popular Continuous Integration
# Systems") and /GeneralInformation/405494 ("License Key for DevExpress Products"). Nothing of DevExpress's is
# included in the published packages.
#
# Secrets (repository Settings → Secrets and variables → Actions):
#   DEVEXPRESS_LICENSE  the contents of the DevExpress_License.txt file from the DevExpress.com Download Manager
#                       ("DOWNLOAD LICENSE KEY"). Personal to the licence holder; never committed.
#   GITHUB_TOKEN        provided automatically; "packages: write" lets the publish job push to the feed, and
#                       "contents: write" — granted to the release job only — lets it create the GitHub Release.
#
# Release notes: the tag's version must have a section in CHANGELOG.md headed "## <version> — <yyyy-mm-dd>[ — <label>]".
# The publish job checks this before building (nothing is published without it); after a successful publish the
# release job creates the GitHub Release from that section (title "<version>[ — <label>]", pre-release when the
# version has a suffix such as -preview.1) and attaches the .nupkg files. The release job runs no repository code.
name: Publish NuGet package

# Only a tag publishes: there is deliberately no manual trigger, so the tag-equals-version check below always runs.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: windows-latest
    env:
      DevExpress_License: ${{ secrets.DEVEXPRESS_LICENSE }}
    steps:
      # persist-credentials: false — the build and tests run repository code; no token stays in the git config.
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check that the tag matches Directory.Build.props
        shell: pwsh
        run: |
          $props = Get-Content Directory.Build.props -Raw
          if ($props -notmatch '<Version>([^<]+)</Version>') { throw 'No <Version> in Directory.Build.props' }
          $version = $matches[1].Trim()
          $tag = '${{ github.ref_name }}'.Substring(1)
          if ($tag -ne $version) { throw "Tag v$tag does not match <Version>$version</Version>" }
          "Publishing version $version"

      - name: Check that CHANGELOG.md has a section for this version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.Substring(1)
          $dash = [string][char]0x2014
          $text = [IO.File]::ReadAllText((Resolve-Path CHANGELOG.md), [Text.Encoding]::UTF8) -replace "`r`n", "`n"
          if ($text -notmatch ('(?m)^## ' + [regex]::Escape($version) + ' ' + $dash + ' \d{4}-\d{2}-\d{2}')) {
            throw "CHANGELOG.md has no section headed '## $version $dash yyyy-mm-dd'; add it before tagging"
          }
          "CHANGELOG.md has a section for $version"

      - name: Check that the DevExpress licence key is present
        shell: pwsh
        run: |
          if (-not $env:DevExpress_License) { throw 'Secret DEVEXPRESS_LICENSE is not set (DevExpress_License.txt contents)' }
          "DevExpress licence key present (" + $env:DevExpress_License.Length + " characters)"

      - name: Restore
        run: dotnet restore Xaf.EditDraft.sln

      # --disable-build-servers: the DevExpress docs recommend it so that the licence check is not served by a cached
      # build process that started without the variable.
      - name: Build
        run: dotnet build Xaf.EditDraft.sln -c Release --no-restore --disable-build-servers

      - name: Test (library)
        run: dotnet test Xaf.EditDraft.Tests/Xaf.EditDraft.Tests.csproj -c Release --no-build

      - name: Test (sample consumer)
        run: dotnet test samples/Xaf.EditDraft.Sample/Xaf.EditDraft.Sample.Tests/Xaf.EditDraft.Sample.Tests.csproj -c Release --no-build

      - name: Pack
        run: |
          dotnet pack Xaf.EditDraft.Core/Xaf.EditDraft.Core.csproj -c Release --no-build -o packages
          dotnet pack Xaf.EditDraft.Blazor/Xaf.EditDraft.Blazor.csproj -c Release --no-build -o packages

      # GitHub Packages does not accept symbol packages, so --no-symbols stops the push from sending the .snupkg
      # that sits next to each .nupkg; the symbol packages are kept as a workflow artifact below.
      - name: Push to GitHub Packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --name github --username "${{ github.actor }}" --password $env:GH_TOKEN --store-password-in-clear-text
          Get-ChildItem packages -Filter *.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --source github --api-key $env:GH_TOKEN --skip-duplicate --no-symbols
          }

      - name: Keep the packages as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: packages/*.*nupkg

  # Creates the GitHub Release after a successful publish. The only job with contents: write; it checks out the
  # repository for CHANGELOG.md only and runs no repository code.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out (CHANGELOG.md only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: packages

      - name: Create the GitHub Release from CHANGELOG.md
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.Substring(1)
          $dash = [string][char]0x2014
          $text = [IO.File]::ReadAllText((Resolve-Path CHANGELOG.md), [Text.Encoding]::UTF8) -replace "`r`n", "`n"
          $m = [regex]::Match($text, '(?ms)^## ' + [regex]::Escape($version) + ' ([^\n]*)\n(.*?)(?=^## |\z)')
          if (-not $m.Success) { throw "CHANGELOG.md has no section for $version" }
          $parts = @($m.Groups[1].Value.Trim() -split [regex]::Escape($dash) | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          if ($parts.Count -lt 1 -or $parts[0] -notmatch '^\d{4}-\d{2}-\d{2}$') { throw "Bad CHANGELOG header for $version" }
          $title = if ($parts.Count -ge 2) { "$version $dash " + ($parts[1..($parts.Count - 1)] -join " $dash ") } else { $version }
          $body = $m.Groups[2].Value.Trim() + "`n`nFull history: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)`n"
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [IO.File]::WriteAllText($notes, $body, (New-Object System.Text.UTF8Encoding($false)))
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) { "Release $tag already exists; not changed"; exit 0 }
          $ghArgs = @('release', 'create', $tag, '--repo', '${{ github.repository }}', '--title', $title, '--notes-file', $notes, '--verify-tag')
          if ($version.Contains('-')) { $ghArgs += '--prerelease' }
          $ghArgs += (Get-ChildItem packages -Filter *.nupkg | Where-Object { $_.Name -notlike '*.snupkg' } | ForEach-Object { $_.FullName })
          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed for $tag" }
          "Created release $tag"
