# Publishes Xaf.EditDraft.Core and Xaf.EditDraft.Blazor to GitHub Packages (this repository's NuGet feed,
# https://nuget.pkg.github.com/JapanDave95/index.json) when a version tag is pushed.
#
#   The tag must equal "v" + <Version> in Directory.Build.props (e.g. v0.1.0-preview.1); the job fails otherwise,
#   so a package version can never be published from a mismatched source.
#
# Secrets (repository Settings → Secrets and variables → Actions):
#   DEVEXPRESS_NUGET_KEY  the DevExpress NuGet feed authorization key (nuget.devexpress.com → "Obtain Feed URL").
#                         Needed only to restore the DevExpress packages the library depends on; nothing of
#                         DevExpress's is included in the published packages.
#   GITHUB_TOKEN          provided automatically; "packages: write" below is what lets it push to the feed.
name: Publish NuGet package

# Only a tag publishes: there is deliberately no manual trigger, so the tag-equals-version check below always runs.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check that the tag matches Directory.Build.props
        shell: pwsh
        run: |
          $props = Get-Content Directory.Build.props -Raw
          if ($props -notmatch '<Version>([^<]+)</Version>') { throw 'No <Version> in Directory.Build.props' }
          $version = $matches[1].Trim()
          $tag = '${{ github.ref_name }}'.Substring(1)
          if ($tag -ne $version) { throw "Tag v$tag does not match <Version>$version</Version>" }
          "Publishing version $version"

      - name: Add the DevExpress NuGet feed
        shell: pwsh
        env:
          DEVEXPRESS_NUGET_KEY: ${{ secrets.DEVEXPRESS_NUGET_KEY }}
        run: |
          if (-not $env:DEVEXPRESS_NUGET_KEY) { throw 'Secret DEVEXPRESS_NUGET_KEY is not set' }
          dotnet nuget add source "https://nuget.devexpress.com/$env:DEVEXPRESS_NUGET_KEY/api" --name DevExpress

      - name: Restore
        run: dotnet restore Xaf.EditDraft.sln

      - name: Build
        run: dotnet build Xaf.EditDraft.sln -c Release --no-restore

      - name: Test (library)
        run: dotnet test Xaf.EditDraft.Tests/Xaf.EditDraft.Tests.csproj -c Release --no-build

      - name: Test (sample consumer)
        run: dotnet test samples/Xaf.EditDraft.Sample/Xaf.EditDraft.Sample.Tests/Xaf.EditDraft.Sample.Tests.csproj -c Release --no-build

      - name: Pack
        run: |
          dotnet pack Xaf.EditDraft.Core/Xaf.EditDraft.Core.csproj -c Release --no-build -o packages
          dotnet pack Xaf.EditDraft.Blazor/Xaf.EditDraft.Blazor.csproj -c Release --no-build -o packages

      # GitHub Packages does not accept symbol packages, so --no-symbols stops the push from sending the .snupkg
      # that sits next to each .nupkg; the symbol packages are kept as a workflow artifact below.
      - name: Push to GitHub Packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --name github --username "${{ github.actor }}" --password $env:GH_TOKEN --store-password-in-clear-text
          Get-ChildItem packages -Filter *.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --source github --api-key $env:GH_TOKEN --skip-duplicate --no-symbols
          }

      - name: Keep the packages as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: packages/*.*nupkg
